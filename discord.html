<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyHavoc Authorization</title>
</head>
<body style="background-color: #1e1e24; color: white; text-align: center; font-family: sans-serif; padding-top: 15%;">
    <h2>SKYHAVOC</h2>
    <p>Authorization successful.</p>
    <p style="font-size: 14px; color: #888;">Click the button below to return to the game:</p>
    
    <!-- Obyčejný, tvrdý odkaz. Žádná mřížka. -->
    <a id="btn-return" href="skyhavoc://auth" style="background-color: #5865F2; color: white; padding: 15px 30px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 18px; display: inline-block; margin-top: 20px;">
        Return to Hangar
    </a>

    <script>
        // Javascript tu udělá jedinou věc: vezme Discord kód z adresy a přilepí ho k tlačítku
        var parametry = window.location.search;
        document.getElementById("btn-return").href = "skyhavoc://auth" + parametry;
    </script>
</body>
</html>
