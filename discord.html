<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyHavoc Authorization</title>
</head>
<body style="background-color: #1e1e24; color: white; text-align: center; font-family: sans-serif; padding-top: 15%;">
    <h2>SKYHAVOC</h2>
    <p>Authorization successful.</p>
    <p style="font-size: 14px; color: #888;">Click the button below to return to the game:</p>
    
    <button onclick="returnToGame()" style="background-color: #5865F2; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px;">
        Return to Hangar
    </button>

    <script>
        function returnToGame() {
            var params = window.location.search; // Získá ?code=XYZ
            
            // >>> TADY VLOŽ SVŮJ UNIQUE NAME Z GODOTU (např. org.godotengine.skyhavoc) <<<
            var package_name = "com.mizmar.skyhavoc"; 
            
            // Tohle je ten VIP příkaz, kterému Android neodporuje
            var chrome_intent = "intent://auth" + params + "#Intent;scheme=skyhavoc;package=" + package_name + ";action=android.intent.action.VIEW;end;";
            
            // Odpálení
            window.location.href = chrome_intent;
        }
    </script>
</body>
</html>
