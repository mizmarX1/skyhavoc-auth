<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SkyHavoc Authorization</title>
    <script>
        function returnToGame() {
            var params = window.location.search;
            var game_link = "skyhavoc://auth" + params;
            window.location.href = game_link;
        }

        window.onload = function() {
            // Automatický pokus o návrat do hry za půl vteřiny
            setTimeout(returnToGame, 500);
        }
    </script>
</head>
<body style="background-color: #1e1e24; color: white; text-align: center; font-family: sans-serif; padding-top: 15%;">
    <h2>SKYHAVOC</h2>
    <p>Authorization successful.</p>
    <p style="font-size: 14px; color: #888;">If the game does not open automatically, click the button below:</p>
    
    <!-- Místo odkazu je zde tlačítko, které natvrdo zavolá Javascript -->
    <button onclick="returnToGame()" style="background-color: #5865F2; color: white; padding: 15px 30px; border: none; border-radius: 8px; font-weight: bold; font-size: 18px; cursor: pointer; margin-top: 20px;">
        Return to Hangar
    </button>
</body>
</html>
